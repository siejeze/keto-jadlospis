<!doctype html>
<html lang="pl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#284d3c"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow,noarchive">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Keto z apetytem">
<title>Keto z apetytem</title>
<link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-180.png"><link rel="icon" href="./icon-192.png">
<style id="lock-style">
*{box-sizing:border-box}body{margin:0;background:#f7f5ed;color:#284d3c;font:16px/1.5 system-ui,sans-serif}.lock{max-width:28rem;margin:clamp(2rem,12vh,8rem) auto;padding:1.6rem}.lock img{border-radius:23%;width:62px;height:62px}.lock h1{font:normal 2.5rem/1.1 Georgia,serif;letter-spacing:-.05em;margin:1.1rem 0}.lock label{display:block;font-weight:600;margin-top:1.5rem}.lock input,.lock button{font:inherit;padding:.75rem .9rem;border-radius:.65rem;width:100%;margin-top:.45rem}.lock input{border:1px solid #9aa79b}.lock button{background:#284d3c;color:white;border:0;cursor:pointer}.lock small{display:block;margin-top:1.2rem}.lock [role=status]{color:#753719}
</style><script src="./otworz.js" defer></script></head>
<body><main class="lock"><img src="./icon-192.png" alt=""><h1>Keto <i>z apetytem</i></h1><p>Wpisz wspólny klucz, żeby otworzyć przepiśnik na tym urządzeniu.</p>
<form id="unlock"><label for="key">Klucz do przepisów</label><input id="key" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" required><button>Otwórz przepisy</button></form>
<p id="feedback" role="status"></p><small>Możesz zapisać klucz w menedżerze haseł telefonu.</small><noscript>Włącz JavaScript, aby odszyfrować przepisy.</noscript></main></body></html>
